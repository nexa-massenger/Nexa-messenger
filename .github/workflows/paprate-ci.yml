name: paprate-ci
on:
  push:
    paths:
      - 'paprate/**'
      - '.github/workflows/paprate-ci.yml'
  pull_request:
    paths:
      - 'paprate/**'
      - '.github/workflows/paprate-ci.yml'
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paprate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile bot.py storage.py
      - run: python -m unittest discover -s tests -v
      - run: docker build -t paprate-bot .
