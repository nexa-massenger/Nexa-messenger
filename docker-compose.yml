services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
    volumes:
      - nexa_data:/app/data
    expose:
      - "3000"
    networks:
      - nexa_internal
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env before deployment}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - nexa_internal
volumes:
  nexa_data:
  caddy_data:
  caddy_config:
networks:
  nexa_internal:
